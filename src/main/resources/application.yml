server:
  port: 8087

spring:
  application:
    name: order-service

# Em k8s, sobrescreva via env vars SERVICES_PAYMENT_URL e SERVICES_SHIPPING_URL
# apontando para os Service DNS names (ex: http://payment-service:8088).
services:
  payment-url: http://localhost:8088
  shipping-url: http://localhost:8089

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  tags:
    application: ${spring.application.name}
