name: cicd order-service

on: 
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:

      - name: checkout code
        uses: actions/checkout@v7

      - name: setup java version
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: maven
      
      - name: mvn test
        run: mvn test

      - name: build artifact
        run: mvn package -DskipTests

      - name: define tag
        id: vars
        run: echo "tag=$(echo ${{ github.sha }} | cut -c1-7)" >> "$GITHUB_OUTPUT"

      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
            
      - name: set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: docker build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ steps.vars.outputs.tag }}
            ${{ secrets.DOCKERHUB_USERNAME }}/order-service:latest

      # - name: Run Trivy vulnerability scanner
      #   uses: aquasecurity/trivy-action@v0.36.0
      #   with:
      #     image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/order-service:${{ steps.vars.outputs.tag }}'
      #     format: 'table'
      #     exit-code: '1'
      #     ignore-unfixed: true
      #     vuln-type: 'os,library'
      #     severity: 'CRITICAL,HIGH'

      - name: checkout gitops tools
        uses: actions/checkout@v7
        with:
          repository: erickfranca/manifests-repo
          token: ${{ secrets.MANIFESTS_REPO_PAT }}
          path: manifests-repo

      - name: update helm chart
        run: | 
          cd manifests-repo
          sed -i "s/tag: .*/tag: \"${{ steps.vars.outputs.tag }}\"/" charts/order-service/values.yaml
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add charts/order-service/values.yaml
          git commit -m "deploy: atualiza imagem para ${{ steps.vars.outputs.tag }}"
          git push